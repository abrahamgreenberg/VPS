# Composite action: build one image and push ONE tag to the private registry.
# Used by latest-<image>.yml (tag "latest") and, later, release.yml (tag YYYY.MM.DD.REV).
#
# Why a composite action and not a reusable workflow: the registry credentials are environment secrets
# of the "registry" GitHub environment (restricted to main). A job that calls a reusable workflow cannot
# declare an environment, and the called workflow does not receive environment secrets, so the login
# step got empty credentials. A composite action runs inside the CALLER's job, which declares
# `environment: registry`, so the caller reads the secrets and passes them in as inputs.
#
# The caller job must already have run actions/checkout (a local action has to be on disk first).
name: Build and push image
description: Build an image with buildx and push one tag to the registry.

inputs:
  registry:
    description: Registry host name, e.g. registry.example.com
    required: true
  username:
    description: Registry user (push access)
    required: true
  password:
    description: Registry password
    required: true
  image:
    description: Repository path in the registry, e.g. apps/hello
    required: true
  context:
    description: Build context directory, e.g. hello
    required: true
  tag:
    description: Tag to push, e.g. latest or 2026.11.06.1
    required: true
  build-args:
    description: Newline-separated KEY=value build arguments (non-secret only)
    default: ""

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USERNAME: ${{ inputs.username }}
        REGISTRY_PASSWORD: ${{ inputs.password }}
      run: |
        [ -n "$REGISTRY" ] || { echo "::error::repository variable REGISTRY is not set"; exit 1; }
        [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ] || {
          echo "::error::REGISTRY_USERNAME / REGISTRY_PASSWORD are empty: set them as secrets of the 'registry' environment"; exit 1; }

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        platforms: linux/amd64
        push: true
        tags: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.tag }}
        build-args: ${{ inputs.build-args }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,scope=${{ inputs.image }},mode=max

    - name: Summary
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.tag }}
      run: |
        {
          echo "### Pushed \`$IMAGE\`"
          echo "Commit \`${GITHUB_SHA::7}\`"
        } >> "$GITHUB_STEP_SUMMARY"
