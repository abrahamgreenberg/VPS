# Push to main touching portfolio/ -> build and push apps/portfolio:latest (development tag).
# Only changes under portfolio/ trigger it. Editing this workflow does NOT: run it by hand to test.
name: latest / portfolio

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: latest-portfolio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-image
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          image: apps/portfolio
          context: portfolio
          tag: latest
