# Reusable: build one image and push ONE tag to the private registry.
# Called by latest-<image>.yml (tag "latest") and, later, release.yml (tag YYYY.MM.DD.REV).
#
# Credentials live in the "registry" GitHub environment (secrets REGISTRY_USERNAME / REGISTRY_PASSWORD, the registry's
# push-only "ci" user), which is restricted to the main branch. Repo variable REGISTRY = registry host name.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: Repository path in the registry, e.g. apps/hello
        type: string
        required: true
      context:
        description: Build context directory, e.g. hello
        type: string
        required: true
      tag:
        description: Tag to push, e.g. latest or 2026.11.06.1
        type: string
        required: true
      build_args:
        description: Newline-separated KEY=value build arguments (non-secret only)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: registry
    env:
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$REGISTRY" ]; then echo "::error::repository variable REGISTRY is not set"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.REGISTRY }}/${{ inputs.image }}:${{ inputs.tag }}
          build-args: ${{ inputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,scope=${{ inputs.image }},mode=max

      - name: Summary
        env:
          IMAGE: ${{ vars.REGISTRY }}/${{ inputs.image }}:${{ inputs.tag }}
        run: |
          {
            echo "### Pushed \`$IMAGE\`"
            echo "Commit \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
