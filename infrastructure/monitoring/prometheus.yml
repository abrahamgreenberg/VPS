global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # cadvisor runs as a global service (one task per node). dns_sd_configs
  # resolves every task IP behind tasks.cadvisor, so this scales automatically
  # as nodes are added to the swarm.
  - job_name: cadvisor
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080

  - job_name: node-exporter
    dns_sd_configs:
      - names: ["tasks.node-exporter"]
        type: A
        port: 9100

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # traefik stack must be attached to monitoring-network and have
  # --metrics.prometheus=true enabled (already the case).
  - job_name: traefik
    static_configs:
      - targets: ["traefik_traefik:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
