# Routing: everything goes to the email contact point. Alerts are grouped so a burst is one email, and
# a still-firing alert is re-sent every 12h until it resolves (resolved notices are sent too).
apiVersion: 1

policies:
  - orgId: 1
    receiver: email
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
