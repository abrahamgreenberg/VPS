# Observability stack. prometheus, loki, tempo, alloy and grafana are images built by CI with their config baked in
# (infrastructure/monitoring/<service>/), tagged latest or a release tag via <SERVICE>_TAG. Stock images (cadvisor,
# node-exporter, postgres-exporter) have no config. Deploy in Portainer: Stacks -> paste this file, env vars ALERT_EMAIL_TO
# (required) and optional *_TAG; registry `deployer` must be added under Registries. Update = push, wait for CI, then
# "Re-pull image and redeploy". CLI alternative: docker stack deploy --with-registry-auth -c stack.yml monitoring
services:

  prometheus:
    image: registry.abrahamgreenberg.co.uk/infra/prometheus:${PROMETHEUS_TAG:-latest}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first

  loki:
    image: registry.abrahamgreenberg.co.uk/infra/loki:${LOKI_TAG:-latest}
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first

  tempo:
    image: registry.abrahamgreenberg.co.uk/infra/tempo:${TEMPO_TAG:-latest}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - tempo_data:/var/tempo
    networks:
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first

  # Image = grafana + provisioning baked in (grafana/Dockerfile, built by CI). Pull needs the registry login:
  # `docker stack deploy --with-registry-auth` or the registry added in Portainer.
  grafana:
    image: registry.abrahamgreenberg.co.uk/infra/grafana:${GRAFANA_TAG:-latest}
    environment:
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: "https://grafana.abrahamgreenberg.co.uk"
      # Outbound alert email through an SMTP relay (see README). Grafana only sends; nothing here receives mail.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com:587}
      GF_SMTP_USER: ${SMTP_USER:-resend}
      GF_SMTP_PASSWORD__FILE: /run/secrets/grafana_smtp_password
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL_FROM:-alerts@abrahamgreenberg.co.uk}
      GF_SMTP_FROM_NAME: "VPS alerts"
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # Recipient, substituted into provisioning/alerting/contact-points.yaml. Required at deploy time.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?set ALERT_EMAIL_TO to the address that receives alerts}
    secrets:
      - grafana_admin_user
      - grafana_admin_password
      - grafana_smtp_password
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - proxy-network
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.abrahamgreenberg.co.uk`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.http.routers.grafana.middlewares=sso@swarm"

  # Public OTLP ingestion gateway (gRPC :4317 + HTTP :4318). Reachable from the
  # internet via alloy.abrahamgreenberg.co.uk, protected by basic auth defined
  # below since it is internet-facing (the sso forward-auth is not used for OTLP clients).
  alloy:
    image: registry.abrahamgreenberg.co.uk/infra/alloy:${ALLOY_TAG:-latest}
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    networks:
      - proxy-network
      - monitoring-network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"

        # OTLP/HTTP (logs, metrics, traces) on the standard websecure entrypoint.
        - "traefik.http.routers.alloy-http.rule=Host(`alloy.abrahamgreenberg.co.uk`)"
        - "traefik.http.routers.alloy-http.entrypoints=websecure"
        - "traefik.http.routers.alloy-http.tls=true"
        - "traefik.http.routers.alloy-http.tls.certresolver=letsencrypt"
        - "traefik.http.routers.alloy-http.service=alloy-http"
        - "traefik.http.routers.alloy-http.middlewares=alloy-auth@swarm"
        - "traefik.http.services.alloy-http.loadbalancer.server.port=4318"

        # OTLP/gRPC on the dedicated grpc entrypoint (see traefik/stack.yml).
        # h2c because alloy's own receiver is plaintext; traefik terminates TLS.
        - "traefik.http.routers.alloy-grpc.rule=Host(`alloy.abrahamgreenberg.co.uk`)"
        - "traefik.http.routers.alloy-grpc.entrypoints=grpc"
        - "traefik.http.routers.alloy-grpc.tls=true"
        - "traefik.http.routers.alloy-grpc.tls.certresolver=letsencrypt"
        - "traefik.http.routers.alloy-grpc.service=alloy-grpc"
        - "traefik.http.routers.alloy-grpc.middlewares=alloy-auth@swarm"
        - "traefik.http.services.alloy-grpc.loadbalancer.server.port=4317"
        - "traefik.http.services.alloy-grpc.loadbalancer.server.scheme=h2c"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - "--docker_only=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring-network
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring-network
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  # Monitors the shared postgres instance deployed by the postgres stack.
  # Reuses that stack's postgres_user / postgres_password secrets.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export DATA_SOURCE_NAME="postgresql://$$(cat /run/secrets/postgres_user):$$(cat /run/secrets/postgres_password)@postgres_postgres:5432/postgres?sslmode=disable"
        exec /bin/postgres_exporter
    secrets:
      - postgres_user
      - postgres_password
    networks:
      - monitoring-network
      - database-network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  proxy-network:
    external: true
  database-network:
    external: true
  monitoring-network:
    external: true

secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  grafana_admin_user:
    external: true
  grafana_admin_password:
    external: true
  grafana_smtp_password:
    external: true
