version: "3.8"

services:
  traefik:
    image: traefik:v3.0

    command:

      # Dashboard/API
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Swarm provider
      - "--providers.swarm=true"
      - "--providers.swarm.exposedByDefault=false"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # HTTP -> HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let's Encrypt
      - "--certificatesresolvers.le.acme.email=abrahamgreenberg123@gmail.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"

      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
      - "--accesslog.bufferingsize=100"
      - "--log.filepath=/logs/traefik.log"


    ports:
      - target: 80
        published: 80
        mode: host

      - target: 443
        published: 443
        mode: host


    volumes:
      - traefik-letsencrypt:/letsencrypt
      - traefik-logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro


    networks:
      - proxy-network


    deploy:

      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager


      labels:

        # Enable Traefik routing for itself
        - "traefik.enable=true"

        # Dashboard router
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.abrahamgreenberg.co.uk`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"

        # TLS
        - "traefik.http.routers.traefik-dashboard.tls=true"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"


      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback


      rollback_config:
        parallelism: 1
        order: stop-first



volumes:

  traefik-letsencrypt:
    name: traefik-letsencrypt

  traefik-logs:
    name: traefik-logs



networks:

  proxy-network:
    external: true