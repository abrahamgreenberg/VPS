services:
  traefik:
    image: traefik:v3.7

    networks:
      - proxy-network

    ports:
        # Long syntax required for Swarm
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host


    volumes:
      # Docker socket for the Swarm provider - must run on a manager node
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent storage for the Let's Encrypt certificate (acme.json)
      - traefik-certs:/certs


    command:
      # HTTP EntryPoint
      - "--entrypoints.web.address=:80"

      # Redirect HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # HTTPS EntryPoint
      - "--entrypoints.websecure.address=:443"

      # Let's Encrypt (ACME) via HTTP-01 challenge on the web entrypoint
      - "--certificatesresolvers.letsencrypt.acme.email=abrahamgreenberg123@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      # Providers
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.watch=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=proxy-network"

      # API & Dashboard
      # TEMP: insecure mode for baseline diagnosis (exposes dashboard unauthenticated on :8080) - revert to false once confirmed working
      - "--api.insecure=true"

      # Observability
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

      labels:
        - "traefik.enable=true"

        # Dashboard router
        - "traefik.http.routers.dashboard.rule=Host(`traefik.abrahamgreenberg.co.uk`)"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.tls=true"
        - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.dashboard.middlewares=crowdsec-bouncer@swarm,authentik@swarm"
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"
  # Optional: test service to confirm routing works. Remove once you've verified the dashboard.
  whoami:
    image: traefik/whoami
    networks:
      - proxy-network
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.whoami.rule=Host(`whoami.abrahamgreenberg.co.uk`)"
        - "traefik.http.routers.whoami.entrypoints=websecure"
        - "traefik.http.routers.whoami.tls=true"
        - "traefik.http.routers.whoami.tls.certresolver=letsencrypt"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"

        - "traefik.http.routers.whoami.middlewares=crowdsec-bouncer@swarm,authentik@swarm"


volumes:
  traefik-certs:

networks:
  proxy-network:
    external: true
