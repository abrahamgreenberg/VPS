services:
  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database-network
    secrets:
      - postgres_user
      - postgres_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: my_app_db
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Or a dedicated data node
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first # Important for stateful services

  pgadmin:
    image: dpage/pgadmin4:latest
    networks:
      - proxy-network
      - database-network
    secrets:
      - pgadmin_default_email
      - pgadmin_default_password
    environment:
      PGADMIN_DEFAULT_EMAIL_FILE: /run/secrets/pgadmin_default_email
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_default_password
      PGADMIN_LISTEN_PORT: 80
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.your-domain.com`)"
        - "traefik.http.routers.pgadmin.service=pgadmin"
        - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
        - "traefik.http.routers.pgadmin.entrypoints=websecure"
        - "traefik.http.routers.pgadmin.tls.certresolver=le"
        # Add your authentication middleware here
        # - "traefik.http.routers.pgadmin.middlewares=authentik@docker"

volumes:
  postgres_data:

networks:
  proxy-network:
    external: true
  database-network:
    external: true

secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  pgadmin_default_email:
    external: true
  pgadmin_default_password:
    external: true
