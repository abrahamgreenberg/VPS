services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest

    environment:
      GID: "${GID:-1000}"
      COLLECTIONS: "crowdsecurity/traefik"

    volumes:
      - crowdsec_db:/var/lib/crowdsec/data/
      - crowdsec_config:/etc/crowdsec/

    networks:
      - crowdsec-net

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      labels:
        - "traefik.enable=false"


  bouncer:
    image: fbonalair/traefik-crowdsec-bouncer:latest

    environment:
      CROWDSEC_BOUNCER_API_KEY: "${CROWDSEC_BOUNCER_API_KEY}"
      CROWDSEC_AGENT_HOST: crowdsec:8080

    networks:
      - crowdsec-net
      - proxy-network

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      labels:
        # Not exposed. Traefik calls the bouncer internally over proxy-network; the
        # crowdsec-bouncer middleware is defined in traefik/stack.yml.
        - "traefik.enable=false"

volumes:
  crowdsec_db:
  crowdsec_config:


networks:
  crowdsec-net:
    driver: overlay
    attachable: true

  proxy-network:
    external: true