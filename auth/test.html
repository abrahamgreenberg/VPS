<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test HTML Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background: #f4f8fb;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #222;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 480px;
        margin: 60px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        color: #0078d7;
        margin-bottom: 16px;
      }
      p {
        font-size: 1.1em;
        margin-bottom: 0;
      }
      .docker-logo {
        width: 64px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg class="docker-logo" viewBox="0 0 64 64" fill="none">
        <rect width="64" height="64" rx="12" fill="#0091E2" />
        <path
          d="M16 40c2 4 8 8 16 8s14-4 16-8c2-4 0-8-4-8h-24c-4 0-6 4-4 8z"
          fill="#fff"
        />
        <rect x="20" y="32" width="4" height="8" rx="1" fill="#0091E2" />
        <rect x="28" y="32" width="4" height="8" rx="1" fill="#0091E2" />
        <rect x="36" y="32" width="4" height="8" rx="1" fill="#0091E2" />
        <rect x="44" y="32" width="4" height="8" rx="1" fill="#0091E2" />
      </svg>
      <h1>Docker HTML Test Page</h1>
      <p>If you see this page, your Docker deployment is working!</p>
    </div>
  </body>
</html>
