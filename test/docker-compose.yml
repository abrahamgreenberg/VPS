services:
  nodejs-app:
    build: ./nodejs
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
    volumes:
      - ./nodejs:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - proxy-network
    container_name: test-nodejs-app

networks:
  proxy-network:
    external: true