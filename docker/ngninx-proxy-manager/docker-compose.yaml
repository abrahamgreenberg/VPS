services:
  # MariaDB database for Nginx Proxy Manager
  npm-db:
    image: mariadb:10.6
    container_name: npm-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_MYSQL_NAME}
      MYSQL_USER: ${DB_MYSQL_USER}
      MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD}
    volumes:
      - npm_db_data:/var/lib/mysql

  # Nginx Proxy Manager
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: always
    env_file: .env
    depends_on:
      - npm-db
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${NPM_PORT}:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  npm_db_data:
  npm_data:
  npm_letsencrypt:

networks:
  proxy-network:   # <-- define the network
    external: true