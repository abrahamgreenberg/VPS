services:
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: pgadmin
    restart: always
    env_file: .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:          
      - proxy-network
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgadmin_data:

networks:
  proxy-network:
    external: true